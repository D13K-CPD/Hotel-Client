<div class="container">
  <div class="main-outer">
    <form>
      <h3>Change Profile Details</h3>
      <div>
        <div>
          <div class="col-12">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>First name</mat-label>
              <input matInput placeholder="John" />
            </mat-form-field>
          </div>

          <div class="col-12">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Last name</mat-label>
              <input matInput placeholder="Doe" />
            </mat-form-field>
          </div>

          <div class="col-12">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Contact number</mat-label>
              <input matInput placeholder="077-345-6789" />
            </mat-form-field>
          </div>
        </div>

        <div class="col-12 signup-btn">
          <button mat-raised-button color="tonal" routerLink="/">Save Changes</button>
        </div>

        <div class="col-12">
          <hr />
          <app-manage-profile-pic />
        </div>
      </div>
    </form>
  </div>
</div>
