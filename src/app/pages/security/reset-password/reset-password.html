<div class="container">
  <div class="main-outer">
    <form>
      <h3>Create New Password</h3>
      <div class="row">
        <div class="col-12">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>New Password</mat-label>
            <p>New Password</p>
            <input matInput placeholder="New Password" type="text" />
          </mat-form-field>
        </div>

        <div class="col-12">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Confirm Password</mat-label>
            <p>Confirm Password</p>
            <input matInput placeholder="Confirm Password" type="text" />
          </mat-form-field>
        </div>

        <div class="col-12 verify-btn">
          <button mat-raised-button color="tonal" routerLink="/security/login">Set Password</button>
        </div>

        <div class="col-12 signup-btn">
          <button mat-raised-button color="tonal" routerLink="/security/login">
            Back to Login
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
