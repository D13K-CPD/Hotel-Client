<div class="container">
  <div class="main-outer">
    <form>
      <h3>Login</h3>
      <div class="row">
        <div class="col-12">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Enter your email</mat-label>
            <input matInput placeholder="pat@example.com" />
          </mat-form-field>
        </div>

        <div class="col-12">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Enter your password</mat-label>
            <input type="{{ showStatus ? 'text' : 'password' }}" matInput />
          </mat-form-field>
        </div>
        <div class="col-12 fgt">
          <a href="#">Forgot password?</a>
        </div>
        <div class="col-12 fgt">
          <mat-checkbox
            [ngModelOptions]="{ standalone: true }"
            [(ngModel)]="showStatus"
            class="example-margin"
            >Show Password</mat-checkbox
          >
        </div>
        <div class="col-12 login-btn">
          <button mat-raised-button color="primary">Login</button>
        </div>
        <div class="col-12 signup-btn">
          <button mat-raised-button color="tonal">Signup</button>
        </div>
      </div>
    </form>
  </div>
</div>
