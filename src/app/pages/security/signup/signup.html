<div class="container">
  <div class="main-outer">
    <form>
      <h3>Signup</h3>
      <div class="row">
        <div class="col-12">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>First name</mat-label>
            <input matInput placeholder="John" />
          </mat-form-field>
        </div>

        <div class="col-12">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Last name</mat-label>
            <input matInput placeholder="Doe" />
          </mat-form-field>
        </div>

        <div class="col-12">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email address</mat-label>
            <input matInput placeholder="john@example.com" />
          </mat-form-field>
        </div>

        <div class="col-12">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Contact number</mat-label>
            <input matInput placeholder="077-345-6789" />
          </mat-form-field>
        </div>

        <div class="col-12">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Enter your password</mat-label>
            <input type="{{ showStatus ? 'text' : 'password' }}" matInput />
          </mat-form-field>
        </div>

        <div class="col-12">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Confirm password</mat-label>
            <input type="{{ showStatus ? 'text' : 'password' }}" matInput />
          </mat-form-field>
        </div>

        <div class="col-12 fgt">
          <mat-checkbox
            [ngModelOptions]="{ standalone: true }"
            [(ngModel)]="showStatus"
            class="example-margin"
            >Show Password</mat-checkbox
          >
        </div>
        <div class="col-12 signup-btn">
          <button
            mat-raised-button
            color="tonal"
            routerLink="/security/register-verification/abc@gmail.com"
          >
            Signup
          </button>
        </div>
        <div class="col-12 signup-btn">
          <p>Already have an account</p>
          <button mat-raised-button color="tonal" routerLink="/security/login">
            Back to Login
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
