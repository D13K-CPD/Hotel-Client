<div class="container">
  <div class="main-outer">
    <form>
      <h3>Forgot Password</h3>
      <div class="row">
        <div class="col-12">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Enter your email</mat-label>
            <p>Enter your email</p>
            <input matInput placeholder="john@example.com" type="email" />
          </mat-form-field>
        </div>

        <div class="col-12 verify-btn">
          <button
            mat-raised-button
            color="tonal"
            routerLink="/security/reset-pwd-verification/abc@gmail.com"
          >
            Send verification code
          </button>
        </div>

        <div class="col-12 signup-btn">
          <button mat-raised-button color="tonal" routerLink="/security/login">
            Back to Login
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
